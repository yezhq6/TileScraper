# TileScraper 配置文件

# 服务器配置
server:
  host: 0.0.0.0
  port: 5000
  debug: false
  secret_key: "your-secret-key-here"

# 下载配置
download:
  max_threads: 128
  default_threads: 8
  max_retries: 3
  timeout: 30
  batch_size: 1000
  # MBTiles 写线程每批提交的行数
  mbtiles_batch_size: 500
  # 有界任务队列大小：生产者在此阻塞，使超大数据量下载的内存占用保持恒定
  task_queue_size: 20000
  # MBTiles 待写入队列大小
  mbtiles_write_queue_size: 20000
  # 断点续传：进度写入的批量大小
  progress_batch_size: 500
  # 断点续传：流式读取已处理瓦片的每页条数（决定内存上界）
  progress_page_size: 50000
  progress_save_interval: 5

# 内存管理
memory:
  max_tiles_in_memory: 100000
  memory_threshold: 0.8

# 数据库配置
database:
  journal_mode: WAL
  cache_size: 1000000
  synchronous: NORMAL
  busy_timeout: 30000
  mmap_size: 268435456

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s:%(lineno)d - %(message)s"
  file: "tilescraper.log"

# 路径配置
paths:
  config_dir: "configs"
  default_output_dir: "tiles_datasets"
  progress_db_dir: ".progress"
